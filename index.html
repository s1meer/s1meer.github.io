<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sameer Ray — AI Engineer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet" type="text/css" />
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      font-family: var(--font-body);
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .font-heading {
      font-family: var(--font-heading);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink {
      animation: blink 1s step-end infinite;
    }
    /* Hide scrollbar for cleaner look */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="relative min-h-screen w-full">

  <video
    id="bg-video"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_041744_63efcd78-bf7d-4039-99e2-2461e8a61903.mp4"
    class="fixed inset-0 w-full h-full object-cover z-0"
    style="object-position: 70% center;"
    muted
    playsinline
    preload="auto"
  ></video>

  <nav class="fixed top-0 w-full px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center z-10">
    <div class="flex flex-row gap-3 items-center">
      <span class="font-heading text-[21px] sm:text-[26px] tracking-tight text-white">
        Sameer Ray®
      </span>
      <span class="text-[25px] sm:text-[30px] text-white select-none" style="letter-spacing: -0.02em;">
        ✳︎
      </span>
    </div>

    <div class="hidden md:flex flex-row text-[23px] text-white">
      <a href="#projects" class="hover:opacity-60 transition-opacity">Projects</a><span>,&nbsp;</span>
      <a href="#experience" class="hover:opacity-60 transition-opacity">Experience</a><span>,&nbsp;</span>
      <a href="#skills" class="hover:opacity-60 transition-opacity">Skills</a><span>,&nbsp;</span>
      <a href="#github" class="hover:opacity-60 transition-opacity">GitHub</a>
    </div>

    <a href="#contact" class="hidden md:block text-[23px] text-white underline underline-offset-2 hover:opacity-60 transition-opacity">
      Get in touch
    </a>

    <button id="mobile-menu-btn" class="md:hidden flex flex-col gap-[5px] z-50 relative">
      <div id="bar-top" class="w-6 h-[2px] bg-white transition-transform duration-300"></div>
      <div id="bar-mid" class="w-6 h-[2px] bg-white transition-opacity duration-300"></div>
      <div id="bar-bot" class="w-6 h-[2px] bg-white transition-transform duration-300"></div>
    </button>
  </nav>

  <div id="mobile-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-md flex flex-col justify-center px-8 gap-8 transition-opacity duration-300 md:hidden z-[9] opacity-0 pointer-events-none">
    <a href="#projects" class="text-[32px] font-medium text-white hover:opacity-60 transition-opacity">Projects</a>
    <a href="#experience" class="text-[32px] font-medium text-white hover:opacity-60 transition-opacity">Experience</a>
    <a href="#skills" class="text-[32px] font-medium text-white hover:opacity-60 transition-opacity">Skills</a>
    <a href="#github" class="text-[32px] font-medium text-white hover:opacity-60 transition-opacity">GitHub</a>
    <a href="#contact" class="text-[32px] font-medium text-white underline hover:opacity-60 transition-opacity">Get in touch</a>
  </div>

  <main class="h-screen w-full flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 overflow-hidden relative z-[1]">
    <div class="max-w-xl relative z-10">
      
      <div class="pointer-events-none select-none mb-5 sm:mb-6 text-white" style="font-size: clamp(18px, 4vw, 26px); line-height: 1.3; font-weight: 400; filter: blur(4px);">
        Hey there, I'm Sameer Ray,<br />
        AI Engineer & Automation Specialist
      </div>

      <p class="text-white mb-5 sm:mb-6 min-h-[54px]" style="font-size: clamp(18px, 4vw, 26px); line-height: 1.35; font-weight: 400;">
        <span id="typewriter-text"></span><span id="cursor" class="inline-block w-[2px] h-[1.1em] bg-white align-middle ml-[2px] animate-blink"></span>
      </p>

      <div id="pill-container" class="flex flex-wrap gap-y-1 transition-all duration-500 ease-out opacity-0 translate-y-2">
        <a href="#" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          Pitch an idea
        </a>
        <a href="https://codezoner.in" target="_blank" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          View CodeZoner
        </a>
        <a href="https://github.com/s1meer" target="_blank" class="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap hover:bg-black hover:text-white transition-colors duration-200">
          See GitHub
        </a>
        
        <button id="copy-email-btn" class="inline-flex items-center justify-center bg-transparent text-white border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap gap-2 sm:gap-3 hover:bg-white hover:text-black transition-colors duration-200 cursor-pointer">
          <span>Reach me: <span class="underline underline-offset-1">sameer.ray.work.official@gmail.com</span></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

    </div>
  </main>

  <script>
    // 1. Mobile Menu Toggle
    const menuBtn = document.getElementById('mobile-menu-btn');
    const overlay = document.getElementById('mobile-overlay');
    const barTop = document.getElementById('bar-top');
    const barMid = document.getElementById('bar-mid');
    const barBot = document.getElementById('bar-bot');
    let isMenuOpen = false;

    menuBtn.addEventListener('click', () => {
      isMenuOpen = !isMenuOpen;
      if (isMenuOpen) {
        overlay.classList.replace('opacity-0', 'opacity-100');
        overlay.classList.replace('pointer-events-none', 'pointer-events-auto');
        barTop.classList.add('rotate-45', 'translate-y-[7px]');
        barMid.classList.add('opacity-0');
        barBot.classList.add('-rotate-45', '-translate-y-[7px]');
      } else {
        overlay.classList.replace('opacity-100', 'opacity-0');
        overlay.classList.replace('pointer-events-auto', 'pointer-events-none');
        barTop.classList.remove('rotate-45', 'translate-y-[7px]');
        barMid.classList.remove('opacity-0');
        barBot.classList.remove('-rotate-45', '-translate-y-[7px]');
      }
    });

    // 2. Typewriter Effect
    const textToType = "Glad you stopped in. I build agentic AI pipelines with Python, Node, and TypeScript. Now, what are we building?";
    const typewriterDest = document.getElementById('typewriter-text');
    const cursor = document.getElementById('cursor');
    
    setTimeout(() => {
      let i = 0;
      const typingInterval = setInterval(() => {
        typewriterDest.textContent += textToType.charAt(i);
        i++;
        if (i >= textToType.length) {
          clearInterval(typingInterval);
          cursor.style.display = 'none'; // Hide cursor when done
        }
      }, 38);
    }, 600); // 600ms start delay

    // 3. Animate Pills In
    setTimeout(() => {
      const pills = document.getElementById('pill-container');
      pills.classList.remove('opacity-0', 'translate-y-2');
      pills.classList.add('opacity-100', 'translate-y-0');
    }, 400);

    // 4. Copy Email to Clipboard
    const copyBtn = document.getElementById('copy-email-btn');
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText("sameer.ray.work.official@gmail.com")
        .then(() => alert("Email copied to clipboard!"))
        .catch(err => console.error("Could not copy text: ", err));
    });

    // 5. Video Mouse Scrubbing
    const video = document.getElementById('bg-video');
    let prevX = null;
    let currentTargetTime = 0;
    let isSeeking = false;
    let pendingTime = null;
    const SENSITIVITY = 0.8;

    window.addEventListener('mousemove', (e) => {
      if (!video || isNaN(video.duration)) return;

      const currentX = e.clientX;
      if (prevX === null) {
        prevX = currentX;
        return;
      }

      const delta = currentX - prevX;
      prevX = currentX;

      const timeDelta = (delta / window.innerWidth) * SENSITIVITY * video.duration;
      currentTargetTime = Math.max(0, Math.min(video.duration, currentTargetTime + timeDelta));

      if (!isSeeking) {
        seekTo(currentTargetTime);
      } else {
        pendingTime = currentTargetTime;
      }
    });

    function seekTo(time) {
      isSeeking = true;
      video.currentTime = time;
    }

    video.addEventListener('seeked', () => {
      isSeeking = false;
      if (pendingTime !== null) {
        const time = pendingTime;
        pendingTime = null;
        seekTo(time);
      }
    });
  </script>
</body>
</html>
