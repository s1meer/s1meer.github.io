/* 
   CYBER-HIMALAYAN 3D THEME
   Deep night sky, obsidian glass, brass/gold extrusions, glowing data streams.
*/
:root {
  --space: #070913;
  --night: #10132A;
  --obsidian: #1A1D36;
  --glass: rgba(26, 29, 54, 0.4);
  --glass-border: rgba(255, 176, 46, 0.3);
  
  --gold-glow: #FFB02E;
  --gold-hi: #FFD07A;
  --gold-dark: #A86B00;
  --gold-grad: linear-gradient(135deg, #FFD07A 0%, #FFB02E 50%, #C26A12 100%);
  
  --snow: #8FB8FF;
  --snow-glow: #D1E1FF;
  --text-main: #F4EFE6;
  --text-muted: #A3A6C2;
  
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'DM Sans', system-ui, sans-serif;
  --f-deva: 'Noto Sans Devanagari', sans-serif;
  
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; background: var(--space); }

/* Ambient Starry Background & Lighting */
body {
  background-color: var(--space);
  color: var(--text-main);
  font: 400 17px/1.55 var(--f-body);
  margin: 0;
  overflow-x: hidden;
  position: relative;
  /* Starry background + radial glows */
  background-image: 
    radial-gradient(800px 600px at 80% 20%, rgba(35, 42, 99, 0.6) 0%, transparent 70%),
    radial-gradient(600px 400px at 20% 80%, rgba(255, 176, 46, 0.08) 0%, transparent 70%),
    radial-gradient(1px 1px at 10% 15%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 30% 45%, #fff 50%, transparent 100%),
    radial-gradient(2px 2px at 80% 75%, #fff 50%, transparent 100%),
    radial-gradient(1px 1px at 60% 30%, #fff 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 90% 10%, #fff 50%, transparent 100%);
  background-attachment: fixed;
}

/* Floating Embers/Snow Animation */
.particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--gold-glow);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--gold-hi), 0 0 20px var(--gold-glow);
  animation: floatUp 15s linear infinite;
  opacity: 0;
}
.particle:nth-child(even) { background: var(--snow); box-shadow: 0 0 10px var(--snow), 0 0 20px var(--snow-glow); animation-duration: 20s; }
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.8; transform: translateY(80vh) scale(1) translateX(10px); }
  50% { transform: translateY(40vh) scale(1) translateX(-15px); }
  90% { opacity: 0.8; }
  100% { transform: translateY(-10vh) scale(0) translateX(20px); opacity: 0; }
}

a { color: var(--gold-glow); text-decoration: none; transition: 0.2s; }
a:hover { color: var(--gold-hi); text-shadow: 0 0 8px rgba(255, 176, 46, 0.4); }
:focus-visible { outline: 2px dashed var(--gold-glow); outline-offset: 4px; }
section[id], main[id] { scroll-margin-top: 120px; position: relative; z-index: 2; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* Typography */
.disp { font-family: var(--f-display); letter-spacing: -0.02em; }
.eyebrow { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-glow); font-weight: 800; text-shadow: 0 2px 10px rgba(255, 176, 46, 0.4); }
h2.sec { font: 800 clamp(32px, 5vw, 56px)/1.1 var(--f-display); margin: 12px 0 0; text-wrap: balance; }
.lead { color: var(--text-muted); max-width: 620px; margin: 16px 0 0; font-size: 18px; }

/* 3D Extruded Buttons */
.btn-3d {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 28px; border-radius: 12px;
  font: 700 15px var(--f-body); color: #000; text-decoration: none; cursor: pointer;
  background: var(--gold-grad);
  border: 1px solid #FFF1D4;
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.4), /* top highlight */
    0 6px 0 var(--gold-dark), /* 3D extrusion */
    0 15px 25px rgba(0,0,0,0.6), /* drop shadow */
    0 0 20px rgba(255, 176, 46, 0.3); /* glow */
  transform: translateY(0);
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.btn-3d:hover {
  transform: translateY(2px);
  box-shadow: 
    inset 0 2px 0 rgba(255,255,255,0.5),
    0 4px 0 var(--gold-dark),
    0 10px 20px rgba(0,0,0,0.6),
    0 0 30px rgba(255, 176, 46, 0.5);
}
.btn-3d:active {
  transform: translateY(6px);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,0.2),
    0 0 0 var(--gold-dark),
    0 4px 10px rgba(0,0,0,0.6);
}

.btn-ghost-3d {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 24px; border-radius: 12px;
  font: 600 15px var(--f-body); color: var(--text-main); text-decoration: none; cursor: pointer;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 
    inset 0 1px 0 rgba(255,255,255,0.1),
    0 4px 0 rgba(10, 12, 25, 0.8),
    0 10px 20px rgba(0,0,0,0.4);
  transform: translateY(0);
  transition: all 0.15s;
}
.btn-ghost-3d:hover {
  border-color: var(--gold-glow);
  transform: translateY(2px);
  box-shadow: 0 2px 0 rgba(10, 12, 25, 0.8), 0 5px 15px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,176,46,0.1);
}
.btn-ghost-3d:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(10,12,25,0.8); }
.btn-ghost-3d .em { overflow-wrap: anywhere; text-align: left; }

/* 3D Glass Navigation */
.nav {
  position: fixed; z-index: 50;
  top: 20px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 48px); max-width: 1120px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 10px 24px;
  border-radius: 16px;
  background: rgba(16, 19, 42, 0.65);

  border-bottom: 2px solid var(--gold-dark); /* Extruded bottom */

  box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
}
